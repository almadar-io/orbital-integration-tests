[package]
name = "orbital-integration-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Cross-crate tests that need the private compiler, the shared native-conformance suite or the template repos"

[lib]
name = "orbital_test_support"

[dependencies]
orbital-core = { git = "https://github.com/almadar-io/orbital-core", branch = "main" }
orbital-lolo = { git = "https://github.com/almadar-io/orbital-lolo", branch = "main" }
serde_json.workspace = true

[dev-dependencies]
orbital-compiler = { git = "https://github.com/almadar-io/orbital-compiler", branch = "main" }
orbital-ffi = { git = "https://github.com/almadar-io/orbital-ffi", branch = "main" }
orbital-canvas = { git = "https://github.com/almadar-io/orbital-canvas", branch = "main" }
orbital-shell-typescript = { git = "https://github.com/almadar-io/orbital-shell-typescript", branch = "main" }
orbital-shell-rust = { git = "https://github.com/almadar-io/orbital-shell-rust", branch = "main" }
orbital-client-dioxus = { git = "https://github.com/almadar-io/orbital-shell-rust", branch = "main", features = ["native"] }
orbital-shell-ios = { git = "https://github.com/almadar-io/orbital-shell-ios", branch = "main" }
orbital-shell-android = { git = "https://github.com/almadar-io/orbital-shell-android", branch = "main" }
orbital-shell-chrome = { git = "https://github.com/almadar-io/orbital-shell-typescript", branch = "main" }
chrono.workspace = true
